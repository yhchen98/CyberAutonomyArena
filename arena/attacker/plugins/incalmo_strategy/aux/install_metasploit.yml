---
# Install and start local Metasploit RPC for Incalmo's low-level RPC actions
# and explicitly selected strategies. RPC clients run on the attacker host
# and connect to 127.0.0.1.
- hosts: "{{ host }}"
  become: true
  become_user: '{{ user }}'

  tasks:
    - name: Check for the Metasploit RPC daemon
      ansible.builtin.stat:
        path: /usr/bin/msfrpcd
      register: msfrpcd_binary

    - name: Check for the Metasploit Python client
      ansible.builtin.command:
        argv: [python3, -c, "import pymetasploit3"]
      register: pymetasploit_client
      failed_when: false
      changed_when: false

    - name: Install Metasploit Framework (Kali's own repo carries it natively)
      apt:
        name: metasploit-framework
        state: present
        update_cache: true
      when: not msfrpcd_binary.stat.exists

    - name: Install pymetasploit3 (msf_rpc_client.py's RPC client library)
      # extra_args (not the newer break_system_packages param - unsupported by this control
      # host's ansible.builtin.pip) to get past Kali's PEP 668 externally-managed-environment
      # guard on its system pip.
      pip:
        name: pymetasploit3
        extra_args: --break-system-packages
      when: pymetasploit_client.rc != 0

    - name: Kill any existing msfrpcd process
      shell: pkill -f '[m]sfrpcd' || true
      changed_when: false

    - name: Start msfrpcd
      # Matches msf_rpc_client.py's _client(): password "password", default port
      # 55553, ssl on (msfrpcd's own default - no -S/--no-ssl flag passed).
      shell: "nohup msfrpcd -P password &>/tmp/msfrpcd.log &"
      args:
        executable: /bin/bash

    - name: Wait for msfrpcd to be listening
      wait_for:
        host: 127.0.0.1
        port: 55553
        timeout: 90
        state: started

    - name: Verify msfrpcd process is running
      shell: pgrep -f '[m]sfrpcd'
      register: pgrep_result
      failed_when: pgrep_result.rc != 0
      changed_when: false
